<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>SCSpineManager Viewer</title>
<!--
  뷰어 탭의 렌더링 페이지 (exe에 포함, https://viewer.scsm/ 으로 제공).
  PixiJS v7 + pixi-spine 4 (Spine 3.7 런타임, 3.6 데이터도 3.7로 처리)
  C#(ViewerHost)과는 window.chrome.webview 메시지로 주고받는다.
-->
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; }
  /* 배경: 투명 확인용 체크무늬 (실제 배경 합성은 이후 '씬 구성' 탭에서) */
  body {
    background-color: #c8c8c8;
    background-image:
      linear-gradient(45deg, #b4b4b4 25%, transparent 25%, transparent 75%, #b4b4b4 75%),
      linear-gradient(45deg, #b4b4b4 25%, transparent 25%, transparent 75%, #b4b4b4 75%);
    background-size: 24px 24px;
    background-position: 0 0, 12px 12px;
    font: 13px "Malgun Gothic", sans-serif;
  }
  #stage { position: absolute; inset: 0; }
  #message { position: absolute; left: 12px; top: 10px; color: #333; pointer-events: none; }
</style>
</head>
<body>
<div id="stage"></div>
<div id="message">리소스 탭에서 세트를 고르면 여기에 표시됩니다.</div>
<script src="lib/pixi.min.js"></script>
<script src="lib/pixi-spine.js"></script>
<script src="viewer.js"></script>
</body>
</html>
